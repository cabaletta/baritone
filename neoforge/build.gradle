import baritone.gradle.task.CreateDistTask
import baritone.gradle.task.ProguardTask

base {
    archivesName = archivesName.get() + "-neoforge"
}

unimined {
    minecraft {
        loader("neoforge", project.neoforge_version)
    }
}

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    // because of multiple sourcesets `common project(":")` doesn't work
    for (sourceSet in rootProject.sourceSets) {
        if (sourceSet == rootProject.sourceSets.test) continue
        if (sourceSet == rootProject.sourceSets.schematica_api) continue
        common sourceSet.output
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

jar {
    // neoforge dev and prod namespaces are both mojmap, so unimined 2.0
    // skips remapJar and a single fat artifact serves both — bundle the
    // common contents here rather than on remapJar
    from(configurations.common)
    manifest {
        attributes(
                'MixinConfigs': 'mixins.baritone.json',
                "MixinConnector": "baritone.launch.BaritoneMixinConnector",

                'Implementation-Title': 'Baritone',
                'Implementation-Version': version,
        )
    }
}

task proguard(type: ProguardTask) {
    proguardVersion "7.8.0"
    compType "neoforge"
}

task createDist(type: CreateDistTask, dependsOn: proguard) {
    compType "neoforge"
}

build.finalizedBy(createDist)

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
