import baritone.gradle.task.CreateDistTask
import baritone.gradle.task.ProguardTask

base {
    archivesName = archivesName.get() + "-fabric"
}

unimined {
    minecraft {
        loader("fabric", project.fabric_version)
    }
    // upstream's fabric.mod.json references an icon that isn't in the repo —
    // pre-existing packaging wart, not a remap error
    remap {
        footgunChecks.set(xyz.wagyourtail.unimined.remap.FootgunCheckLevel.WARN)
    }
}

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    // because of multiple sourcesets `common project(":")` doesn't work
    for (sourceSet in rootProject.sourceSets) {
        if (sourceSet == rootProject.sourceSets.test) continue
        if (sourceSet == rootProject.sourceSets.schematica_api) continue
        common sourceSet.output
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// unimined 2.0's remapJar mirrors jar's spec — add the common contents
// so the production jar is fat while the -dev jar stays thin
tasks.matching { it.name == "remapJar" }.configureEach {
    from(configurations.common)
}

task proguard(type: ProguardTask) {
    proguardVersion "7.8.0"
    compType "fabric"
}

task createDist(type: CreateDistTask, dependsOn: proguard) {
    compType "fabric"
}

build.finalizedBy(createDist)

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
