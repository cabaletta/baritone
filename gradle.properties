# Build Performance Optimizations
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache disabled due to UniMined plugin incompatibility
# org.gradle.configuration-cache=true
org.gradle.daemon.idletimeout=10800000
org.gradle.workers.max=4

# Java version configuration
java_version=17

# Kotlin DSL performance
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.incremental.compilation=true

# CI/CD compatibility - These values are now in gradle/libs.versions.toml
# but kept here for backwards compatibility with CI scripts
mod_version=1.9.5
maven_group=baritone
archives_base_name=baritone
