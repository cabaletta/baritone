name: Test 1.7.10 (Podman)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build Podman Image
        run: |
          podman build -f Containerfile -t baritone-1.7.10-build .

      - name: Run Tests In Podman
        run: |
          podman run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/baritone-1.7.10 \
            baritone-1.7.10-build \
            gradle test
