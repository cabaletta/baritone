name: Build Fabric jar (Minecraft 1.21.8)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release and upload built jar(s)? (true/false)'
        required: false
        default: 'false'
      release_tag:
        description: 'Release tag to use if creating a release (e.g. v1.21.8-build-001)'
        required: false
        default: 'v1.21.8-build-${{ github.run_id }}'
  push:
    branches:
      - 1.21.8

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: fabric-1.21.8-jars
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21 (Microsoft)
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '21'
          cache: 'gradle'

      - name: Show Java info
        run: java -version && javac -version

      - name: Run Gradle build
        # Adjust the Gradle task if your project builds a remapped jar with a different task (eg :fabric:remapJar)
        run: ./gradlew clean build --no-daemon
        env:
          JAVA_HOME: ${{ runner.tool_cache }}/java

      - name: List candidate jars
        run: |
          echo "Looking for jars produced by the build:"
          find . -type f -name "*.jar" -not -path "*/.gradle/*" -maxdepth 6 -print || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabric-1.21.8-jars
          path: |
            **/build/libs/*.jar
            **/fabric/build/libs/*.jar
            **/mod/build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.create_release == 'true' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: fabric-1.21.8-jars
          path: ./artifact

      - name: Create GitHub release and upload jars
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          body: "Automated build for Fabric / Minecraft 1.21.8 (generated by workflow)."
          artifacts: "./artifact/**/*.jar"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
