name: Build 1.7.10 (Podman)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build In Podman
        run: |
          chmod +x scripts/podman-build-1.7.10.sh
          ./scripts/podman-build-1.7.10.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baritone-1.7.10-jar
          path: baritone-1.7.10/build/libs/*.jar
          if-no-files-found: error
